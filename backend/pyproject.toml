[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.156.4",
    "pydantic-settings>=2.16.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = ["httpx>=0.28.1", "pytest>=9.1.1", "ruff>=0.17.1"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
